<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1A1E23">
  <title>Log in · ADC Support Groups</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/styles.css">
  <script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
  <script src="assets/app.js" defer></script>
  <style>
    .auth-visual h2 { font-size: clamp(2.5rem, 4.5vw, 4rem); font-weight: 800; letter-spacing: -0.045em; line-height: .98; }
    .auth-visual h2 span { color: var(--green); }
    .pulse-list { display: grid; gap: 10px; max-width: 380px; }
    .pulse { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 16px; background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow-card); }
    .pulse b { font-weight: 600; }
  </style>
</head>
<body>
  <div class="auth">

    <!-- Desktop only -->
    <aside class="auth-visual" aria-hidden="true">
      <span class="brand"><span class="brand-mark"><b>ADC</b></span><span class="brand-name">ADC Support Groups</span></span>
      <h2>Your group.<br><span>All in one place.</span></h2>
      <div class="pulse-list">
        <div class="pulse"><span class="icon-tile"><i data-lucide="megaphone" class="i"></i></span><span class="grow"><b>Rally · Kano</b><br><span class="faint small">2,400 people</span></span><span class="chip chip-approved"><i data-lucide="check" class="i"></i>Approved</span></div>
        <div class="pulse"><span class="icon-tile red"><i data-lucide="hand-coins" class="i"></i></span><span class="grow"><b>₦250,000</b><br><span class="faint small">Ibadan chapter</span></span><span class="chip chip-paid"><i data-lucide="check" class="i"></i>Paid</span></div>
      </div>
    </aside>

    <main class="auth-main" style="position:relative">
      <div class="auth-glow"></div>
      <div class="hide-desktop" style="position:relative">
        <span class="brand"><span class="brand-mark"><b>ADC</b></span><span class="brand-name">ADC Support Groups</span></span>
      </div>

      <div class="auth-inner" style="position:relative">
        <h1 class="h1">Welcome back</h1>
        <p class="muted mt-1">Log in to your group.</p>

        <div class="segmented mt-6" data-pressed-group>
          <button type="button" aria-pressed="true" data-show="phone">Phone</button>
          <button type="button" aria-pressed="false" data-show="email">Email</button>
        </div>

        <form class="mt-5" onsubmit="event.preventDefault(); location.href='home.html'">
          <div class="field" data-view="phone">
            <label class="label" for="phone">Phone number</label>
            <div class="input-group"><span class="prefix">+234</span><input id="phone" class="input" inputmode="tel" autocomplete="tel" placeholder="803 123 4567"></div>
          </div>
          <div class="field" data-view="email" hidden>
            <label class="label" for="email">Email</label>
            <input id="email" class="input" type="email" autocomplete="email" placeholder="you@email.com">
          </div>
          <div class="field">
            <div class="row-between"><label class="label" for="pw">Password</label><a class="small" href="#" data-open="forgot" style="margin-bottom:8px">Forgot?</a></div>
            <input id="pw" class="input" type="password" autocomplete="current-password" placeholder="••••••••">
          </div>
          <button class="btn btn-primary btn-lg btn-block mt-6" type="submit">Log in</button>
        </form>

        <div class="row mt-8" style="gap:10px">
          <a class="btn btn-block" href="join.html" style="flex:1"><i data-lucide="link" class="i"></i>Join a group</a>
          <a class="btn btn-block" href="register-group.html" style="flex:1"><i data-lucide="flag" class="i"></i>New group</a>
        </div>
      </div>
    </main>
  </div>

  <div class="dialog-backdrop" id="forgot" role="dialog" aria-modal="true" aria-labelledby="fg-t">
    <div class="dialog">
      <h2 id="fg-t">Reset password</h2>
      <p class="muted mt-1">We'll send you a code.</p>
      <div class="field mt-5"><label class="label" for="fg-p">Phone or email</label><input id="fg-p" class="input" placeholder="0803 123 4567"></div>
      <div class="dialog-actions"><button class="btn" data-close>Cancel</button><button class="btn btn-primary" data-close data-toast="Code sent">Send code</button></div>
    </div>
  </div>
</body>
</html>
