<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FFFFFF">
  <title>Pay · ADC Support Groups</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/styles.css">
  <script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
  <script src="assets/app.js" defer></script>
</head>
<body data-shell="leader" data-active="payments" data-title="Pay" data-back="payments.html">
<main id="page" class="main-narrow">
<form data-wizard>
  <span class="step-count">Step 1 of 4</span>
  <div class="stepper mt-2"><span></span><span></span><span></span><span></span></div>

  <!-- 1. For -->
  <section data-step class="mt-6" data-tab-scope>
    <h1 class="h1">Pay for</h1>
    <div class="segmented mt-5" data-pressed-group>
      <button type="button" aria-pressed="true" data-show="cause">Cause</button>
      <button type="button" aria-pressed="false" data-show="general">General</button>
    </div>

    <div class="choices mt-4" data-view="cause">
      <label class="choice" style="align-items:flex-start">
        <input type="radio" name="for" checked><span class="dot" style="margin-top:2px"></span>
        <span class="grow">
          <span class="choice-title">Lagos rally logistics</span>
          <span class="progress progress-sm mt-3" style="display:block"><span style="width:68%"></span></span>
          <span class="row-between choice-desc mt-2"><span>₦34m of ₦50m</span><span>10 Dec</span></span>
        </span>
      </label>
      <label class="choice" style="align-items:flex-start">
        <input type="radio" name="for"><span class="dot" style="margin-top:2px"></span>
        <span class="grow">
          <span class="choice-title">North West posters</span>
          <span class="progress progress-sm mt-3" style="display:block"><span style="width:31%"></span></span>
          <span class="row-between choice-desc mt-2"><span>₦9.3m of ₦30m</span><span>20 Dec</span></span>
        </span>
      </label>
      <label class="choice" style="align-items:flex-start">
        <input type="radio" name="for"><span class="dot" style="margin-top:2px"></span>
        <span class="grow">
          <span class="choice-title">Radio jingles</span>
          <span class="progress progress-sm mt-3" style="display:block"><span style="width:12%"></span></span>
          <span class="row-between choice-desc mt-2"><span>₦2.4m of ₦20m</span><span>5 Jan</span></span>
        </span>
      </label>
    </div>

    <div data-view="general" hidden>
      <div class="choice-grid mt-4">
        <label class="choice choice-tile"><input type="radio" name="purpose" checked><span class="tile-icon"><i data-lucide="users" class="i"></i></span><span class="choice-title">Mobilisation</span></label>
        <label class="choice choice-tile"><input type="radio" name="purpose"><span class="tile-icon"><i data-lucide="bus" class="i"></i></span><span class="choice-title">Logistics</span></label>
        <label class="choice choice-tile"><input type="radio" name="purpose"><span class="tile-icon"><i data-lucide="radio" class="i"></i></span><span class="choice-title">Media</span></label>
        <label class="choice choice-tile"><input type="radio" name="purpose"><span class="tile-icon"><i data-lucide="package" class="i"></i></span><span class="choice-title">Materials</span></label>
        <label class="choice choice-tile"><input type="radio" name="purpose"><span class="tile-icon"><i data-lucide="ellipsis" class="i"></i></span><span class="choice-title">Other</span></label>
      </div>
      <div class="field mt-4"><label class="label" for="note">Note <span class="opt">(optional)</span></label><input id="note" class="input" placeholder="e.g. Buses for Ikeja"></div>
    </div>

    <div class="action-bar"><button class="btn btn-primary btn-lg btn-block" data-next>Next</button></div>
  </section>

  <!-- 2. Who -->
  <section data-step class="mt-6">
    <h1 class="h1">Who is paying?</h1>
    <div class="choices mt-5">
      <label class="choice"><input type="radio" name="who" checked><span class="dot"></span><span class="icon-tile grey"><i data-lucide="users-round" class="i"></i></span><span class="grow"><span class="choice-title">Whole group</span><span class="choice-desc" style="display:block">Atiku Women Network</span></span></label>
      <label class="choice"><input type="radio" name="who"><span class="dot"></span><span class="icon-tile grey"><i data-lucide="network" class="i"></i></span><span class="grow"><span class="choice-title">A chapter</span><span class="choice-desc" style="display:block">Counts for the group too</span></span></label>
    </div>
    <div class="field mt-4"><label class="label" for="ch">Chapter</label><select id="ch" class="select"><option>Lagos</option><option>Plateau</option><option>Kano</option></select></div>
    <div class="action-bar row"><button class="btn btn-lg" data-prev aria-label="Back"><i data-lucide="arrow-left" class="i"></i></button><button class="btn btn-primary btn-lg grow" data-next>Next</button></div>
  </section>

  <!-- 3. Amount -->
  <section data-step class="mt-6">
    <h1 class="h1">Amount</h1>
    <label class="amount-input mt-5" for="amt"><span>₦</span><input id="amt" inputmode="numeric" value="250,000" aria-label="Amount in Naira"></label>
    <div class="pills mt-3" data-pressed-group>
      <button type="button" class="pill" aria-pressed="false">50k</button>
      <button type="button" class="pill" aria-pressed="false">100k</button>
      <button type="button" class="pill" aria-pressed="true">250k</button>
      <button type="button" class="pill" aria-pressed="false">500k</button>
      <button type="button" class="pill" aria-pressed="false">1m</button>
    </div>
    <div class="field mt-6"><label class="label" for="act">Link activity <span class="opt">(optional)</span></label><select id="act" class="select"><option>None</option><option>Rally, Ikeja · 12 Nov</option><option>Town hall, Jos · Sat</option></select></div>
    <div class="action-bar row"><button class="btn btn-lg" data-prev aria-label="Back"><i data-lucide="arrow-left" class="i"></i></button><button class="btn btn-primary btn-lg grow" data-next>Next</button></div>
  </section>

  <!-- 4. Check -->
  <section data-step class="mt-6">
    <h1 class="h1">Check</h1>
    <div class="card mt-5">
      <p class="eyebrow">Amount</p>
      <p class="display mt-1" style="font-size:2.25rem">₦250,000</p>
      <dl class="kv mt-3" style="margin-bottom:0">
        <div><dt>For</dt><dd>Lagos rally logistics</dd></div>
        <div><dt>Paid by</dt><dd>Lagos chapter</dd></div>
        <div><dt>Activity</dt><dd>Rally, Ikeja</dd></div>
      </dl>
    </div>
    <p class="faint small mt-3 row" style="gap:6px"><i data-lucide="lock" class="i i-sm"></i>Secure payment by Funz</p>
    <div class="action-bar row"><button class="btn btn-lg" data-prev aria-label="Back"><i data-lucide="arrow-left" class="i"></i></button><button class="btn btn-primary btn-lg grow" type="button" data-open="paid">Pay with Funz</button></div>
  </section>
</form>
</main>

<div class="dialog-backdrop" id="paid" role="dialog" aria-modal="true" aria-labelledby="paid-t">
  <div class="dialog">
    <div class="result">
      <span class="icon-tile"><i data-lucide="check" class="i"></i></span>
      <h2 id="paid-t">Paid</h2>
      <p class="display mt-2" style="font-size:2rem">₦250,000</p>
      <p class="faint small mt-1">Receipt FZ-2026-118204</p>
    </div>
    <a class="btn btn-primary btn-block mt-6" href="receipt.html">View receipt</a>
    <a class="btn btn-ghost btn-block mt-2" href="payments.html">Done</a>
  </div>
</div>
</body>
</html>
