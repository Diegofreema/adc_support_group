<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FFFFFF">
  <title>Causes · ADC Support Groups</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/styles.css">
  <script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
  <script src="assets/app.js" defer></script>
</head>
<body data-shell="directorate" data-active="causes" data-title="Causes" data-back="admin-more.html">
<main id="page">
<div class="page-head-row">
  <h1 class="h1">Causes</h1>
  <button class="btn btn-primary" data-open="new-cause"><i data-lucide="plus" class="i"></i>New cause</button>
</div>

<div class="pills" data-pressed-group>
  <button class="pill" aria-pressed="true">Open · 6</button>
  <button class="pill" aria-pressed="false">Closed · 14</button>
</div>

<div class="grid-2 mt-4">
  <div class="card">
    <div class="row-between"><span class="chip chip-verified"><i data-lucide="circle-dot" class="i"></i>Open</span><span class="small faint">Ends 10 Dec</span></div>
    <h3 class="h3 mt-3">Lagos mega rally</h3>
    <div class="progress mt-4"><span style="width:68%"></span></div>
    <div class="row-between mt-2 small"><span><b>₦34m</b> <span class="faint">of ₦50m</span></span><span class="faint">41 groups</span></div>
    <div class="row mt-4"><a class="btn btn-sm grow" href="admin-payments.html">Payments</a><button class="btn btn-sm grow" data-open="new-cause">Edit</button></div>
  </div>
  <div class="card">
    <div class="row-between"><span class="chip chip-verified"><i data-lucide="circle-dot" class="i"></i>Open</span><span class="small faint">Ends 30 Nov</span></div>
    <h3 class="h3 mt-3">North East radio</h3>
    <div class="progress mt-4"><span style="width:92%"></span></div>
    <div class="row-between mt-2 small"><span><b>₦18.4m</b> <span class="faint">of ₦20m</span></span><span class="faint">63 groups</span></div>
    <div class="row mt-4"><a class="btn btn-sm grow" href="admin-payments.html">Payments</a><button class="btn btn-sm grow" data-open="new-cause">Edit</button></div>
  </div>
  <div class="card">
    <div class="row-between"><span class="chip chip-verified"><i data-lucide="circle-dot" class="i"></i>Open</span><span class="small faint">Ends 20 Dec</span></div>
    <h3 class="h3 mt-3">Anambra rally</h3>
    <div class="progress mt-4"><span style="width:21%"></span></div>
    <div class="row-between mt-2 small"><span><b>₦2.1m</b> <span class="faint">of ₦10m</span></span><span class="faint">9 groups</span></div>
    <div class="row mt-4"><a class="btn btn-sm grow" href="admin-payments.html">Payments</a><button class="btn btn-sm grow" data-open="new-cause">Edit</button></div>
  </div>
  <div class="card">
    <div class="row-between"><span class="chip chip-verified"><i data-lucide="circle-dot" class="i"></i>Open</span><span class="small faint">Ends 15 Dec</span></div>
    <h3 class="h3 mt-3">North West posters</h3>
    <div class="progress mt-4"><span style="width:31%"></span></div>
    <div class="row-between mt-2 small"><span><b>₦9.3m</b> <span class="faint">of ₦30m</span></span><span class="faint">22 groups</span></div>
    <div class="row mt-4"><a class="btn btn-sm grow" href="admin-payments.html">Payments</a><button class="btn btn-sm grow" data-open="new-cause">Edit</button></div>
  </div>
</div>
</main>
<div class="dialog-backdrop" id="new-cause" role="dialog" aria-modal="true" aria-labelledby="nc-t">
  <div class="dialog">
    <h2 id="nc-t">New cause</h2>
    <div class="field mt-4"><label class="label" for="nc-n">Name</label><input id="nc-n" class="input" placeholder="e.g. Kano rally"></div>
    <div class="field"><label class="label" for="nc-d">Short note <span class="opt">(optional)</span></label><input id="nc-d" class="input" placeholder="What it pays for"></div>
    <div class="grid-2 mt-4" style="grid-template-columns:1fr 1fr">
      <div class="field"><label class="label" for="nc-a">Target (₦)</label><input id="nc-a" class="input" inputmode="numeric" placeholder="10,000,000"></div>
      <div class="field" style="margin-top:0"><label class="label" for="nc-e">Ends</label><input id="nc-e" class="input" type="date"></div>
    </div>
    <div class="field"><label class="label" for="nc-v">Who can see it</label><select id="nc-v" class="select"><option>All groups</option><option>Some states</option></select></div>
    <div class="dialog-actions"><button class="btn" data-close>Cancel</button><button class="btn btn-primary" data-close data-toast="Cause created">Create</button></div>
  </div>
</div>
</body>
</html>
