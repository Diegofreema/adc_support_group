<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F5F6F8">
  <title>Receipt · ADC Support Groups</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/styles.css">
  <script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
  <script src="assets/app.js" defer></script>
</head>
<body data-shell="leader" data-active="payments" data-title="Receipt" data-back="payments.html">
<main id="page" class="main-narrow">
  <article class="card card-lg receipt">
    <div class="row-between">
      <span class="brand"><span class="brand-mark"><b>ADC</b></span><span class="brand-name">Receipt</span></span>
      <span class="chip chip-paid"><i data-lucide="check" class="i"></i>Paid</span>
    </div>
    <div class="center mt-8">
      <p class="eyebrow">Amount</p>
      <p class="display mt-2" style="font-size:2.75rem">₦250,000</p>
      <p class="faint small mt-1">31 Oct 2026, 10:42</p>
    </div>
    <hr class="divider mt-6">
    <dl class="kv" style="margin:0">
      <div><dt>Group</dt><dd>Atiku Women Network</dd></div>
      <div><dt>Chapter</dt><dd>Lagos</dd></div>
      <div><dt>Paid by</dt><dd>Amaka Okafor</dd></div>
      <div><dt>For</dt><dd>Lagos rally logistics</dd></div>
      <div><dt>Activity</dt><dd>Rally, Ikeja</dd></div>
      <div><dt>Method</dt><dd>Funz · Transfer</dd></div>
      <div><dt>Receipt no.</dt><dd class="num">FZ-2026-118204</dd></div>
    </dl>
  </article>
  <div class="row mt-5">
    <button class="btn grow" data-toast="Shared"><i data-lucide="share-2" class="i"></i>Share</button>
    <button class="btn btn-primary grow" data-toast="Downloading PDF"><i data-lucide="download" class="i"></i>Download</button>
  </div>
</main>
<style>
  @media print { .sidebar, .topbar, .bottomnav, .receipt ~ .row { display: none !important; } .main { padding: 0; } }
</style>
</body>
</html>
