<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FFFFFF">
  <title>Offline payment · ADC Support Groups</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/styles.css">
  <script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
  <script src="assets/app.js" defer></script>
</head>
<body data-shell="leader" data-active="payments" data-title="Offline payment" data-back="payments.html">
<main id="page" class="main-narrow">
  <h1 class="h1">Paid offline</h1>
  <div class="banner banner-info mt-4"><i data-lucide="info" class="i"></i><span>Counts after staff check.</span></div>

  <form class="mt-5" onsubmit="event.preventDefault()">
    <div class="field"><label class="label" for="for">For</label><select id="for" class="select"><option>Lagos rally logistics</option><option>North West posters</option><option>General support</option></select></div>
    <div class="field"><label class="label" for="ch">Paid by</label><select id="ch" class="select"><option>Whole group</option><option>Lagos chapter</option><option>Kano chapter</option></select></div>
    <div class="field"><label class="label" for="amt">Amount</label><label class="amount-input" for="amt"><span>₦</span><input id="amt" inputmode="numeric" placeholder="0"></label></div>
    <div class="grid-2 mt-4" style="grid-template-columns:minmax(0,1fr) minmax(0,1fr)">
      <div class="field"><label class="label" for="dt">Date</label><input id="dt" class="input" type="date" value="2026-10-28"></div>
      <div class="field" style="margin-top:0"><label class="label" for="how">How</label><select id="how" class="select"><option>Transfer</option><option>Cash</option></select></div>
    </div>
    <div class="field mt-4"><label class="label" for="ref">Reference <span class="opt">(optional)</span></label><input id="ref" class="input" placeholder="Bank reference"></div>
    <div class="field"><span class="label">Proof</span>
      <label class="dropzone"><i data-lucide="upload" class="i i-lg"></i><span class="bold">Add photo or PDF</span><span class="faint small">Receipt or screenshot</span><input type="file" accept="image/*,.pdf" hidden></label>
    </div>
    <div class="action-bar"><a class="btn btn-primary btn-lg btn-block" href="payments.html" data-toast="Sent for check">Send</a></div>
  </form>
</main>
</body>
</html>
