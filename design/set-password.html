<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F5F6F8">
  <title>New password · ADC Support Groups</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/styles.css">
  <script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
  <script src="assets/app.js" defer></script>
  <style>
    .pw-rules { display: grid; gap: 6px; margin-top: 10px; font-size: .875rem; color: var(--text-3); }
    .pw-rules li { list-style: none; display: flex; align-items: center; gap: 8px; }
    .pw-rules li.ok { color: var(--green); }
  </style>
</head>
<body class="no-nav">
<div class="auth">
  <aside class="auth-visual" aria-hidden="true">
    <span class="brand"><span class="brand-mark"><b>ADC</b></span><span class="brand-name">ADC Support Groups</span></span>
    <h2>One last step.<br><span>Make it yours.</span></h2>
    <span class="faint small">adcsupportgroups.ng</span>
  </aside>

  <main class="auth-main">
    <div class="hide-desktop"><span class="brand"><span class="brand-mark"><b>ADC</b></span><span class="brand-name">ADC Support Groups</span></span></div>

    <form class="auth-inner" onsubmit="event.preventDefault(); location.href='member-home.html'">
      <span class="icon-tile"><i data-lucide="key-round" class="i"></i></span>
      <h1 class="h1 mt-4">New password</h1>
      <p class="muted mt-1">Replace the one we sent you.</p>

      <div class="field mt-6">
        <label class="label" for="p1">New password</label>
        <input id="p1" class="input" type="password" autocomplete="new-password" value="kano2027">
        <ul class="pw-rules">
          <li class="ok"><i data-lucide="check" class="i i-sm"></i>8+ characters</li>
          <li class="ok"><i data-lucide="check" class="i i-sm"></i>A number</li>
          <li><i data-lucide="circle" class="i i-sm"></i>Not the old one</li>
        </ul>
      </div>
      <div class="field"><label class="label" for="p2">Repeat password</label><input id="p2" class="input" type="password" autocomplete="new-password"></div>
      <label class="check mt-4"><input type="checkbox"><span class="small">Show password</span></label>

      <button class="btn btn-primary btn-lg btn-block mt-6" type="submit">Save</button>
    </form>
  </main>
</div>
</body>
</html>
