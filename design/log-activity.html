<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F5F6F8">
  <title>Record activity · ADC Support Groups</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/styles.css">
  <script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
  <script src="assets/app.js" defer></script>
</head>
<body data-shell="leader" data-active="activities" data-title="Record activity" data-back="home.html">
<main id="page" class="main-narrow">
<form data-wizard>
  <div class="row-between"><span class="step-count">Step 1 of 4</span></div>
  <div class="stepper mt-2"><span></span><span></span><span></span><span></span></div>

  <!-- 1. What -->
  <section data-step class="mt-6">
    <h1 class="h1">What did you do?</h1>
    <div class="choice-grid mt-5">
      <label class="choice choice-tile"><input type="radio" name="t" checked><span class="tile-icon"><i data-lucide="megaphone" class="i"></i></span><span class="choice-title">Rally</span></label>
      <label class="choice choice-tile"><input type="radio" name="t"><span class="tile-icon"><i data-lucide="mic" class="i"></i></span><span class="choice-title">Town hall</span></label>
      <label class="choice choice-tile"><input type="radio" name="t"><span class="tile-icon"><i data-lucide="footprints" class="i"></i></span><span class="choice-title">Door-to-door</span></label>
      <label class="choice choice-tile"><input type="radio" name="t"><span class="tile-icon"><i data-lucide="smartphone" class="i"></i></span><span class="choice-title">Media</span></label>
      <label class="choice choice-tile"><input type="radio" name="t"><span class="tile-icon"><i data-lucide="award" class="i"></i></span><span class="choice-title">Endorsement</span></label>
      <label class="choice choice-tile"><input type="radio" name="t"><span class="tile-icon"><i data-lucide="book-open" class="i"></i></span><span class="choice-title">Voter education</span></label>
      <label class="choice choice-tile"><input type="radio" name="t"><span class="tile-icon"><i data-lucide="package" class="i"></i></span><span class="choice-title">Materials</span></label>
      <label class="choice choice-tile"><input type="radio" name="t"><span class="tile-icon"><i data-lucide="hammer" class="i"></i></span><span class="choice-title">Community project</span></label>
      <label class="choice choice-tile"><input type="radio" name="t"><span class="tile-icon"><i data-lucide="vote" class="i"></i></span><span class="choice-title">Election day</span></label>
      <label class="choice choice-tile"><input type="radio" name="t"><span class="tile-icon"><i data-lucide="ellipsis" class="i"></i></span><span class="choice-title">Other</span></label>
    </div>
    <div class="action-bar"><button class="btn btn-primary btn-lg btn-block" data-next>Next</button></div>
  </section>

  <!-- 2. Details -->
  <section data-step class="mt-6">
    <h1 class="h1">Details</h1>
    <div class="field mt-5"><label class="label" for="ti">Title</label><input id="ti" class="input" placeholder="e.g. Rally at Kofar Mata"></div>
    <div class="grid-2 mt-4" style="grid-template-columns:1fr 1fr">
      <div class="field"><label class="label" for="dt">Date</label><input id="dt" class="input" type="date" value="2026-10-31"></div>
      <div class="field" style="margin-top:0"><label class="label" for="pp">People</label><input id="pp" class="input" inputmode="numeric" placeholder="0"></div>
    </div>
    <div class="field mt-4"><label class="label" for="st">State</label><select id="st" class="select"><option>Kano</option></select></div>
    <div class="grid-2 mt-4" style="grid-template-columns:1fr 1fr">
      <div class="field"><label class="label" for="lg">LGA</label><select id="lg" class="select"><option>Municipal</option></select></div>
      <div class="field" style="margin-top:0"><label class="label" for="wd">Ward</label><select id="wd" class="select"><option>Kofar Mata</option></select></div>
    </div>
    <div class="field"><label class="label" for="nt">Note <span class="opt">(optional)</span></label><textarea id="nt" class="textarea" placeholder="Anything to add"></textarea></div>
    <div class="action-bar row"><button class="btn btn-lg" data-prev aria-label="Back"><i data-lucide="arrow-left" class="i"></i></button><button class="btn btn-primary btn-lg grow" data-next>Next</button></div>
  </section>

  <!-- 3. Photos -->
  <section data-step class="mt-6">
    <h1 class="h1">Add photos</h1>
    <p class="muted mt-1">Up to 6.</p>
    <div class="photo-grid mt-5">
      <div class="photo"><span class="ph ph-1 ph-crowd"></span><button class="x" type="button" aria-label="Remove photo"><i data-lucide="x" class="i i-sm"></i></button></div>
      <div class="photo"><span class="ph ph-2"></span><button class="x" type="button" aria-label="Remove photo"><i data-lucide="x" class="i i-sm"></i></button></div>
      <div class="photo"><span class="ph ph-3 ph-crowd"></span><button class="x" type="button" aria-label="Remove photo"><i data-lucide="x" class="i i-sm"></i></button></div>
      <label class="photo-add"><i data-lucide="camera" class="i i-lg"></i>Add<input type="file" accept="image/*" capture="environment" hidden></label>
    </div>
    <div class="field mt-6"><label class="label" for="vl">Video link <span class="opt">(optional)</span></label><input id="vl" class="input" placeholder="YouTube, TikTok, Facebook"></div>
    <div class="action-bar row"><button class="btn btn-lg" data-prev aria-label="Back"><i data-lucide="arrow-left" class="i"></i></button><button class="btn btn-primary btn-lg grow" data-next>Next</button></div>
  </section>

  <!-- 4. Check -->
  <section data-step class="mt-6">
    <h1 class="h1">Check and send</h1>
    <div class="list mt-5">
      <div class="list-item"><span class="icon-tile"><i data-lucide="megaphone" class="i"></i></span><span class="grow"><span class="meta">Activity</span><span class="title" style="display:block">Rally at Kofar Mata</span></span></div>
      <div class="list-item"><span class="icon-tile grey"><i data-lucide="map-pin" class="i"></i></span><span class="grow"><span class="meta">Where</span><span class="title" style="display:block">Kofar Mata, Kano</span></span></div>
      <div class="list-item"><span class="icon-tile grey"><i data-lucide="users" class="i"></i></span><span class="grow"><span class="meta">People</span><span class="title" style="display:block">2,400</span></span></div>
      <div class="list-item"><span class="icon-tile grey"><i data-lucide="image" class="i"></i></span><span class="grow"><span class="meta">Photos</span><span class="title" style="display:block">3</span></span></div>
    </div>
    <div class="action-bar row"><button class="btn btn-lg" data-prev aria-label="Back"><i data-lucide="arrow-left" class="i"></i></button><button class="btn btn-primary btn-lg grow" data-open="sent" type="button">Send</button></div>
  </section>
</form>
</main>

<div class="dialog-backdrop" id="sent" role="dialog" aria-modal="true" aria-labelledby="sent-t">
  <div class="dialog center">
    <span class="icon-tile" style="width:64px;height:64px;border-radius:22px;margin:0 auto"><i data-lucide="check" class="i i-lg"></i></span>
    <h2 id="sent-t" class="mt-4">Sent</h2>
    <p class="muted mt-1">Waiting for approval.</p>
    <a class="btn btn-primary btn-block mt-6" href="home.html">Done</a>
  </div>
</div>
</body>
</html>
