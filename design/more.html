<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FFFFFF">
  <title>More · ADC Support Groups</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">

<body data-shell="leader" data-active="more" data-title="More">
<main id="page" class="main-narrow">
  <a class="list mt-0" href="profile.html" style="display:block;color:inherit">
    <span class="list-item"><span class="avatar avatar-lg">AO</span><span class="grow"><span class="h3" style="display:block">Amaka Okafor</span><span class="meta">Leader · Atiku Women Network</span></span><i data-lucide="chevron-right" class="i chev"></i></span>
  </a>

  <div class="section-title"><h2>Group</h2></div>
  <nav class="list">
    <a class="list-item" href="members.html"><span class="icon-tile grey"><i data-lucide="contact-round" class="i"></i></span><span class="grow title">Members</span><span class="faint small num">3,482</span><i data-lucide="chevron-right" class="i chev"></i></a>
    <a class="list-item" href="chapters.html"><span class="icon-tile grey"><i data-lucide="network" class="i"></i></span><span class="grow title">Chapters</span><span class="faint small num">14</span><i data-lucide="chevron-right" class="i chev"></i></a>
    <a class="list-item" href="messages.html"><span class="icon-tile grey"><i data-lucide="send" class="i"></i></span><span class="grow title">Messages</span><i data-lucide="chevron-right" class="i chev"></i></a>
  </nav>

  <div class="section-title"><h2>Account</h2></div>
  <nav class="list">
    <a class="list-item" href="notifications.html"><span class="icon-tile grey"><i data-lucide="bell" class="i"></i></span><span class="grow title">Notifications</span><span class="chip chip-rejected">3</span><i data-lucide="chevron-right" class="i chev"></i></a>
    <a class="list-item" href="profile.html"><span class="icon-tile grey"><i data-lucide="circle-user-round" class="i"></i></span><span class="grow title">Profile</span><i data-lucide="chevron-right" class="i chev"></i></a>
    <a class="list-item" href="#"><span class="icon-tile grey"><i data-lucide="life-buoy" class="i"></i></span><span class="grow title">Help</span><i data-lucide="chevron-right" class="i chev"></i></a>

  <button class="btn btn-danger btn-block mt-8" data-open="logout"><i data-lucide="log-out" class="i"></i>Log out</button>

<div class="dialog-backdrop" id="logout" role="dialog" aria-modal="true" aria-labelledby="lo-t">
  <div class="dialog">
    <h2 id="lo-t">Log out?</h2>
    <div class="dialog-actions"><button class="btn" data-close>Cancel</button><a class="btn btn-danger-solid" href="index.html">Log out</a></div>
  </div>
</div>
