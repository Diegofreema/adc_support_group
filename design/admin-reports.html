<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F5F6F8">
  <title>Reports · ADC Support Groups</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/styles.css">
  <script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
  <script src="assets/app.js" defer></script>
</head>
<body data-shell="directorate" data-active="reports" data-title="Reports" data-back="admin-more.html">
<main id="page">
<div class="page-head-row"><h1 class="h1">Reports</h1></div>

<div class="split">
  <div class="card">
    <span class="label">What</span>
    <div class="choice-grid" style="grid-template-columns:repeat(2,1fr)">
      <label class="choice choice-tile"><input type="radio" name="w" checked><span class="tile-icon"><i data-lucide="shield-check" class="i"></i></span><span class="choice-title">Groups</span></label>
      <label class="choice choice-tile"><input type="radio" name="w"><span class="tile-icon"><i data-lucide="users-round" class="i"></i></span><span class="choice-title">Members</span></label>
      <label class="choice choice-tile"><input type="radio" name="w"><span class="tile-icon"><i data-lucide="megaphone" class="i"></i></span><span class="choice-title">Activities</span></label>
      <label class="choice choice-tile"><input type="radio" name="w"><span class="tile-icon"><i data-lucide="banknote" class="i"></i></span><span class="choice-title">Payments</span></label>
    </div>

    <div class="grid-2 mt-5">
      <div class="field"><label class="label" for="r-s">State</label><select id="r-s" class="select"><option>All states</option><option>Kano</option></select></div>
      <div class="field" style="margin-top:0"><label class="label" for="r-l">LGA</label><select id="r-l" class="select"><option>All LGAs</option></select></div>
      <div class="field" style="margin-top:0"><label class="label" for="r-c">Category</label><select id="r-c" class="select"><option>All categories</option></select></div>
      <div class="field" style="margin-top:0"><label class="label" for="r-d">Period</label><select id="r-d" class="select"><option>All time</option><option>This month</option></select></div>
    </div>

    <div class="field">
      <span class="label">Format</span>
      <div class="segmented" data-pressed-group>
        <button type="button" aria-pressed="true">Excel</button>
        <button type="button" aria-pressed="false">CSV</button>
      </div>
    </div>
    <button class="btn btn-primary btn-lg btn-block mt-6" data-toast="Preparing file"><i data-lucide="download" class="i"></i>Download</button>
  </div>

  <aside class="split-side">
    <div class="section-title mt-0"><h2>Recent</h2></div>
    <div class="list">
      <a class="list-item" href="#" data-toast="Downloading"><span class="icon-tile grey"><i data-lucide="file-spreadsheet" class="i"></i></span><span class="grow"><span class="title" style="display:block">Groups · Kano</span><span class="meta">Excel · Today</span></span><i data-lucide="download" class="i chev"></i></a>
      <a class="list-item" href="#" data-toast="Downloading"><span class="icon-tile grey"><i data-lucide="file-spreadsheet" class="i"></i></span><span class="grow"><span class="title" style="display:block">Payments · Oct</span><span class="meta">CSV · Mon</span></span><i data-lucide="download" class="i chev"></i></a>
      <a class="list-item" href="#" data-toast="Downloading"><span class="icon-tile grey"><i data-lucide="file-spreadsheet" class="i"></i></span><span class="grow"><span class="title" style="display:block">Activities · All</span><span class="meta">Excel · 28 Oct</span></span><i data-lucide="download" class="i chev"></i></a>
    </div>
  </aside>
</div>
</main>

</body>
</html>
