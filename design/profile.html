<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FFFFFF">
  <title>Profile · ADC Support Groups</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/styles.css">
  <script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
  <script src="assets/app.js" defer></script>
</head>
<body data-shell="leader" data-active="profile" data-title="Profile" data-back="more.html">
<main id="page" class="main-narrow">

  <div class="row">
    <span class="avatar avatar-lg">AO</span>
    <div class="grow"><h1 class="h2">Amaka Okafor</h1><p class="muted small">0803 555 0142</p></div>
  </div>

  <div class="section-title"><h2>Details</h2></div>
  <form class="card" onsubmit="event.preventDefault(); toast('Saved')">
    <div class="field"><label class="label" for="nm">Full name</label><input id="nm" class="input" value="Amaka Okafor"></div>
    <div class="field"><label class="label" for="em">Email <span class="opt">(optional)</span></label><input id="em" class="input" type="email" value="amaka.okafor@gmail.com"></div>
    <div class="field"><label class="label" for="st">State</label><select id="st" class="select"><option>Lagos</option></select></div>
    <div class="grid-2 mt-4" style="grid-template-columns:minmax(0,1fr) minmax(0,1fr)">
      <div class="field"><label class="label" for="lg">LGA</label><select id="lg" class="select"><option>Ikeja</option></select></div>
      <div class="field" style="margin-top:0"><label class="label" for="wd">Ward</label><select id="wd" class="select"><option>Ward 2</option></select></div>
    </div>
    <button class="btn btn-primary btn-block mt-6" type="submit">Save</button>
  </form>

  <div class="section-title"><h2>My groups</h2></div>
  <div class="list">
    <a class="list-item" href="group.html"><span class="group-mark">AW</span><span class="grow"><span class="title truncate" style="display:block">Atiku Women Network</span><span class="meta">Leader</span></span><i data-lucide="chevron-right" class="i chev"></i></a>
    <a class="list-item" href="group.html"><span class="group-mark g5">SM</span><span class="grow"><span class="title truncate" style="display:block">Surulere Market Women</span><span class="meta">Member</span></span><i data-lucide="chevron-right" class="i chev"></i></a>
  </div>

  <div class="section-title"><h2>Alerts</h2></div>
  <div class="list">
    <label class="setting"><span class="row"><i data-lucide="mail" class="i faint"></i>Email</span><span class="toggle"><input type="checkbox" checked><span></span></span></label>
    <label class="setting"><span class="row"><i data-lucide="message-square" class="i faint"></i>SMS</span><span class="toggle"><input type="checkbox" checked><span></span></span></label>
    <label class="setting"><span class="row"><i data-lucide="languages" class="i faint"></i>Language</span><select class="select" style="width:auto;min-height:44px" aria-label="Language"><option>English</option></select></label>
  </div>

  <div class="section-title"><h2>Security</h2></div>
  <div class="list">
    <button class="list-item w-full" style="border:0;background:none;text-align:left;cursor:pointer" data-open="pw"><span class="icon-tile grey"><i data-lucide="key-round" class="i"></i></span><span class="grow title">Change password</span><i data-lucide="chevron-right" class="i chev"></i></button>
    <button class="list-item w-full" style="border:0;border-top:1px solid var(--line);background:none;text-align:left;cursor:pointer" data-open="out"><span class="icon-tile red"><i data-lucide="log-out" class="i"></i></span><span class="grow title red">Log out</span></button>
  </div>
</main>

<div class="dialog-backdrop" id="pw" role="dialog" aria-modal="true" aria-labelledby="pw-t">
  <div class="dialog">
    <h2 id="pw-t">Change password</h2>
    <div class="field mt-5"><label class="label" for="op">Current</label><input id="op" class="input" type="password"></div>
    <div class="field"><label class="label" for="np">New</label><input id="np" class="input" type="password" placeholder="8+ characters"></div>
    <div class="dialog-actions"><button class="btn" data-close>Cancel</button><button class="btn btn-primary" data-close data-toast="Password changed">Save</button></div>
  </div>
</div>

<div class="dialog-backdrop" id="out" role="dialog" aria-modal="true" aria-labelledby="out-t">
  <div class="dialog">
    <h2 id="out-t">Log out?</h2>
    <div class="dialog-actions"><button class="btn" data-close>Cancel</button><a class="btn btn-danger-solid" href="index.html">Log out</a></div>
  </div>
</div>
</body>
</html>
