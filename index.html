<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ADC Support Group</title>
    <meta name="theme-color" content="#0b7a3b" />
  </head>
  <body>
    <div id="root">
      <!-- Shown until the app has loaded the session (React replaces it): the
           app's frame in grey, so the first paint already looks like the app. -->
      <style>
        .boot{min-height:100vh;background:#F3F4F0;font-family:system-ui,sans-serif}
        .boot i{display:block;border-radius:2px;background:linear-gradient(90deg,#E5E7E1 0%,#F1F2EE 40%,#E5E7E1 80%);background-size:300% 100%;animation:boot-shine 1.4s ease-in-out infinite}
        @keyframes boot-shine{from{background-position:100% 0}to{background-position:-50% 0}}
        @media (prefers-reduced-motion:reduce){.boot i{animation:none;background:#E5E7E1}}
        .boot-side{display:none}
        .boot-top{height:60px;background:#fff;border-bottom:1px solid #D5D8D0;display:flex;align-items:center;gap:12px;padding:0 16px}
        .boot-logo{width:36px;height:36px;border-radius:6px;background:#1B6B2F;color:#fff;display:grid;place-items:center;font:700 11px system-ui}
        .boot-main{padding:22px 16px 100px;max-width:1120px;margin:0 auto}
        .boot-stats{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:#D5D8D0;border:1px solid #D5D8D0;border-radius:6px;overflow:hidden}
        .boot-stat{background:#fff;padding:14px 16px;display:grid;gap:8px}
        .boot-card{margin-top:22px;background:#fff;border:1px solid #D5D8D0;border-radius:6px}
        .boot-row{display:flex;align-items:center;gap:14px;padding:14px 16px;min-height:66px}
        .boot-row+.boot-row{border-top:1px solid #E3E5DF}
        .boot-row div{flex:1;display:grid;gap:8px}
        .boot-nav{position:fixed;left:0;right:0;bottom:0;height:68px;background:#fff;border-top:1px solid #D5D8D0;display:grid;grid-template-columns:repeat(5,1fr);align-items:center;justify-items:center}
        .boot-nav span{display:grid;gap:6px;justify-items:center}
        @media (min-width:960px){
          .boot{display:grid;grid-template-columns:248px 1fr}
          .boot-side{display:block;background:#14181D;min-height:100vh;padding:22px 20px}
          .boot-side i{background:linear-gradient(90deg,#262C33 0%,#323941 40%,#262C33 80%);background-size:300% 100%;margin-bottom:20px}
          .boot-top .boot-logo{display:none}
          .boot-main{padding:34px 44px}
          .boot-stats{grid-template-columns:repeat(4,1fr)}
          .boot-nav{display:none}
        }
      </style>
      <div class="boot" role="status" aria-label="Loading">
        <aside class="boot-side">
          <i style="width:150px;height:30px;margin-bottom:34px"></i>
          <i style="width:120px;height:12px"></i><i style="width:150px;height:12px"></i><i style="width:100px;height:12px"></i>
          <i style="width:130px;height:12px"></i><i style="width:110px;height:12px"></i><i style="width:140px;height:12px"></i>
        </aside>
        <div>
          <header class="boot-top"><span class="boot-logo">ADC</span><i style="width:110px;height:14px"></i></header>
          <main class="boot-main">
            <div class="boot-stats">
              <div class="boot-stat"><i style="width:55%;height:10px"></i><i style="width:40%;height:26px"></i><i style="width:65%;height:10px"></i></div>
              <div class="boot-stat"><i style="width:55%;height:10px"></i><i style="width:40%;height:26px"></i><i style="width:65%;height:10px"></i></div>
              <div class="boot-stat"><i style="width:55%;height:10px"></i><i style="width:40%;height:26px"></i><i style="width:65%;height:10px"></i></div>
              <div class="boot-stat"><i style="width:55%;height:10px"></i><i style="width:40%;height:26px"></i><i style="width:65%;height:10px"></i></div>
            </div>
            <div class="boot-card">
              <div class="boot-row"><i style="width:40px;height:40px;border-radius:4px"></i><div><i style="width:60%;height:13px"></i><i style="width:38%;height:10px"></i></div></div>
              <div class="boot-row"><i style="width:40px;height:40px;border-radius:4px"></i><div><i style="width:48%;height:13px"></i><i style="width:52%;height:10px"></i></div></div>
              <div class="boot-row"><i style="width:40px;height:40px;border-radius:4px"></i><div><i style="width:36%;height:13px"></i><i style="width:38%;height:10px"></i></div></div>
              <div class="boot-row"><i style="width:40px;height:40px;border-radius:4px"></i><div><i style="width:56%;height:13px"></i><i style="width:46%;height:10px"></i></div></div>
            </div>
          </main>
        </div>
        <nav class="boot-nav">
          <span><i style="width:22px;height:22px;border-radius:4px"></i><i style="width:36px;height:8px"></i></span>
          <span><i style="width:22px;height:22px;border-radius:4px"></i><i style="width:36px;height:8px"></i></span>
          <span><i style="width:22px;height:22px;border-radius:4px"></i><i style="width:36px;height:8px"></i></span>
          <span><i style="width:22px;height:22px;border-radius:4px"></i><i style="width:36px;height:8px"></i></span>
          <span><i style="width:22px;height:22px;border-radius:4px"></i><i style="width:36px;height:8px"></i></span>
        </nav>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
